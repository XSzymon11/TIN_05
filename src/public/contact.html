<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz kontaktowy</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/contact.js" defer></script>
</head>
<body>

<div class="page-wrapper">
    <div class="card">
        <h1>Formularz kontaktowy</h1>
        <p class="subtitle">
            Podaj swoje dane i wyślij wiadomość. Formularz jest wysyłany asynchronicznie.
        </p>

        <form id="contactForm" method="post" action="/api/contact" novalidate>
            <div class="form-group">
                <label for="name">Imię / Nick</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="np. ShadowWolf"
                        required
                >
            </div>

            <div class="form-group">
                <label for="email">Adres e-mail</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="np. nick@example.com"
                        required
                >
            </div>

            <div class="form-group">
                <label for="age">Wiek</label>
                <input
                        type="number"
                        id="age"
                        name="age"
                        min="18"
                        max="100"
                        placeholder="np. 19"
                        required
                >
            </div>

            <div class="form-group">
                <label for="message">Wiadomość</label>
                <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Napisz coś sensownego (min. 10 znaków)"
                        required
                ></textarea>
            </div>

            <button type="submit">Wyślij wiadomość</button>
        </form>

        <div id="clientErrors"></div>
        <div id="serverResponse"></div>

        <a href="/index.html" class="link-back">← Powrót na stronę główną</a>
    </div>
</div>

</body>
</html>
